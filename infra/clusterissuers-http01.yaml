# Let's Encrypt ClusterIssuers using the HTTP-01 solver (Traefik ingress).
#
# Use this instead of infra/bootstrap.sh when your DNS is NOT on Cloudflare.
# HTTP-01 validates over port 80 via k3s's built-in Traefik, so it needs no DNS
# provider API token and works on any DNS provider. Requires: the mail host's A
# record resolving to the node, and inbound port 80 reachable.
#
# ACME_EMAIL is where Let's Encrypt sends expiry and renewal notices, and it
# identifies the ACME account. It is deliberately NOT committed — substitute it
# at apply time so no deployment inherits someone else's address.
#
# Apply with the guard, so a forgotten variable aborts before kubectl runs:
#
#   : "${ACME_EMAIL:?set ACME_EMAIL to the address Let's Encrypt should contact}" \
#     && envsubst < infra/clusterissuers-http01.yaml | kubectl apply -f -
#
#   kubectl get clusterissuer   # le-staging, le-prod -> READY=True
#
# The guard matters: cert-manager treats acme.email as OPTIONAL, so a bare
# `envsubst | kubectl apply` with ACME_EMAIL unset substitutes an empty string and
# is accepted — registering an ACME account with no contact address and no warning.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: le-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: le-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: le-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
