global:
  domain: ""                 # required; e.g. example.com. Everything derives from it.
  mailHostname: ""           # default mail.<domain>
  tlsSecretName: ""          # default mail-<domain>-tls (matches certificate.yaml naming)
  # Stable, release-independent Service names so vendored subchart configs resolve
  # in-cluster (postfix main.cf points at these). Each service chart must create a
  # Service with the matching name.
  serviceNames:
    raven: raven
    rspamd: rspamd
    opendkim: opendkim
    s3: seaweedfs-s3
    postfix: postfix
    thunderLb: thunder-lb
  # Thunder admin credential, created by templates/thunder-admin-secret.yaml and
  # read by BOTH raven (raven.thunder.systemPasswordSecret) and the Thunder setup
  # job (thunder.setup.secretEnv). This is the canonical name — the template fails
  # the render if either consumer's literal disagrees with it.
  #
  # password: leave empty to generate one on first install and reuse whatever is
  # already in the cluster thereafter (upgrades never rotate it). Set it
  # explicitly for GitOps / `helm template | kubectl apply`, where `lookup` can't
  # see the cluster and would otherwise emit a new random value each render.
  thunderAdmin:
    secretName: opengovmail-thunder-admin
    secretKey: password
    password: ""
  # Shared S3 credentials so seaweedfs (server) and raven (client) always agree.
  # secretKey "" => both charts DERIVE the same key from the release name
  # (deterministic, no cross-lookup) so a fresh one-command install matches out
  # of the box. Set a real secretKey in prod.
  s3:
    accessKey: raven
    secretKey: ""
    bucket: email-attachments
  imagePullSecrets: []
  # TLS lives under global so subcharts (postfix) can gate their config on it,
  # not just the umbrella's certificate.yaml.
  tls:
    enabled: true
    # Staging by default so a first install cannot burn the Let's Encrypt
    # production duplicate-certificate limit (5/week per identical name set, and
    # this chart issues two Certificates per install) while DNS and the HTTP-01
    # path are still being validated. Switch once `kubectl get certificate -n <ns>`
    # shows READY=True:
    #   --set global.tls.issuer=le-prod
    # Staging certs are NOT publicly trusted, so raven's JWKS fetch and mail-client
    # OAuth fail TLS verification until you do.
    issuer: le-staging
    renewBefore: "720h" # renew 30 days before expiry
    # Empty -> derives [ mail.<domain>, <domain> ] from global.domain, so the
    # cert Secret postfix mounts (opengovmail.tlsSecretName) always exists. Override
    # only to add extra SANs.
    domains: []
  # SASL auth is served by raven. Disable for a raven-less standalone bring-up
  # (postfix still accepts mail on 25; submission works without auth).
  sasl:
    enabled: true

opendkim:
  enabled: true

postfix:
  enabled: true

redis:
  enabled: false

unbound:
  enabled: false

rspamd:
  enabled: false

raven:
  enabled: true
  hostPort:
    enabled: true
  tls:
    # Empty -> the raven chart derives the cert-manager Secret from global.domain
    # (mail-<domain-dashed>-tls, the name templates/certificate.yaml mints).
    existingSecret: ""
    certManagerKeys: true
  thunder:
    # Empty -> both derive the BARE <global.domain>, overriding the raven chart's
    # in-cluster default.
    #
    # host feeds raven.yaml's auth_server_url (https://<host>:8090/auth/credentials/
    # authenticate) and publicHost feeds oauth_issuer_url / oauth_jwks_url. All three
    # are HTTPS, so the name must be one Thunder's certificate covers — and Thunder
    # serves the cert for the bare domain, not mail.<domain>. An in-cluster name
    # (opengovmail-thunder-service) is not a SAN on that cert either, and raven has no
    # skip-verify or custom-CA option, so neither can be used here.
    #
    # Consequence: raven's in-cluster calls resolve the public name to the node's
    # external IP and hairpin back through klipper/servicelb. Verified working on
    # single-node k3s, but it needs hairpin NAT to the node's external IP —
    # clusters/CNIs without it will fail with no in-cluster fallback.
    # Fixing this properly requires a TLS terminator that also carries an
    # in-cluster SAN; tracked with the Thunder cert-mount work.
    host: ""
    publicHost: ""
    # CONSOLE app id (has system:ou:view scope). raven needs it to get a token for
    # OU->domain resolution during login. Without it, raven falls back to reading
    # `docker logs thunder-setup` (compose-only, no Docker socket in k8s) and login
    # fails with "unable to resolve expected IdP domain".
    #
    # Deliberately EMPTY: Thunder's bootstrap mints a new CONSOLE application UUID
    # on every install, so no committed value can be right for anyone else. Read it
    # after the first install and pass it on the next upgrade:
    #   kubectl exec -n opengovmail deploy/opengovmail-thunder-deployment -- \
    #     sqlite3 -json /opt/thunder/repository/database/configdb.db \
    #     "select ID, json_extract(APP_JSON,'\$.properties.url') from APPLICATION;"
    # The entry whose url ends in /console is the one to use.
    applicationId: ""
    # System identity for OU resolution: authenticate as admin (has system:ou:view)
    # to read the logging-in user's OU domain. Password from the bootstrap admin secret.
    systemUsername: admin
    systemPasswordSecret: opengovmail-thunder-admin
    systemPasswordSecretKey: password

seaweedfs:
  enabled: true
  s3:
    accessKey: raven
    secretKey: ""
    bucket: email-attachments
# Thunder identity server. Values below reproduce the docker-compose thunder
# setup (services/docker-compose.yaml): a shared SQLite database seeded from the
# image, a one-time setup job, and the bootstrap scripts.
#
# The server image tag is deliberately NOT pinned here — it defaults to the
# subchart's appVersion, so bumping the dependency version in Chart.yaml also
# moves the image. Pinning it here silently decouples the two.
#
# The bootstrap ConfigMap is rendered by the umbrella from
# files/thunder-bootstrap/ (templates/thunder-bootstrap-configmap.yaml), so no
# out-of-band script is needed to create it.
thunder:
  enabled: true

  deployment:
    # SQLite is single-writer, so run exactly one pod (matches the single
    # `thunder` container in compose).
    replicaCount: 1
    securityContext:
      # SQLite needs a writable filesystem; the chart requires this to be false
      # whenever a sqlite database is used.
      readOnlyRootFilesystem: false

  # A single SQLite pod cannot be horizontally scaled. The chart defaults HPA on
  # (min 1 / max 10); a 2nd pod sharing the one RWO PVC locks writes and breaks
  # user creation ("failed to create user"). Must stay off while on SQLite.
  hpa:
    enabled: false

  # In compose, thunder is reached in-cluster on 8090 (raven -> thunder:8090).
  # External access to the console/gate UIs on 8090 comes from
  # templates/thunder-lb.yaml, not from this ingress.
  ingress:
    enabled: false

  # SQLite requires a PVC. An init container seeds it from the image on first
  # start — this is the Helm equivalent of the compose `thunder-db-init` service
  # (and the shared thunder-db / consent-db volumes).
  persistence:
    enabled: true
    size: 1Gi

  configuration:
    # Public URL the console/gate SPAs are served from and call back to.
    # Becomes the JWT issuer, so it must equal raven's oauth_issuer_url. Keep in
    # sync with setup.env THUNDER_PUBLIC_URL below, otherwise the CONSOLE app's
    # redirect URI won't match and OAuth login fails.
    server:
      publicUrl: ""
    # gate UI is served by Thunder on :8090 (via the thunder-lb), not :443.
    gateClient:
      hostname: ""
      port: 8090
    # Must match the app raven authenticates as (EMAIL_APP, per the bootstrap).
    jwt:
      audience: "EMAIL_APP"
    database:
      config:
        type: "sqlite"
      runtime:
        type: "sqlite"
      user:
        type: "sqlite"
    consent:
      enabled: true
      database:
        type: "sqlite"

  # One-time initialization job (compose `thunder-setup` running ./setup.sh).
  setup:
    enabled: true
    # setup.sh runs the main and consent servers plus the bootstrap scripts in
    # one pod; the chart default (100Mi) OOM-kills the consent server with
    # "exited unexpectedly".
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 256Mi
    env:
      - name: THUNDER_ADMIN_USERNAME
        value: "admin"
      # Must match configuration.server.publicUrl above. The bootstrap script
      # registers the CONSOLE app's redirect URI as ${THUNDER_PUBLIC_URL}/console;
      # unset, it falls back to THUNDER_API_BASE (localhost) and console login
      # fails with "Invalid redirect URI".
      - name: THUNDER_PUBLIC_URL
        value: ""
    # Admin password comes from the Secret the umbrella creates
    # (templates/thunder-admin-secret.yaml); no kubectl step is needed. The name
    # must equal global.thunderAdmin.secretName and raven.thunder.systemPasswordSecret
    # — the template fails the render if they diverge. To read the generated value:
    #   kubectl get secret opengovmail-thunder-admin -n opengovmail \
    #     -o jsonpath='{.data.password}' | base64 -d
    secretEnv:
      - name: THUNDER_ADMIN_PASSWORD
        secretName: opengovmail-thunder-admin
        secretKey: password
        optional: false

  # Bootstrap scripts, delivered via the ConfigMap the umbrella renders from
  # files/thunder-bootstrap/. Listing files mounts only these via subPath,
  # preserving the image's default bootstrap scripts (e.g. common.sh, which
  # 01/02 source).
  #
  # This name is the single source of truth: templates/thunder-bootstrap-configmap.yaml
  # reads it too, so the ConfigMap that gets created and the one the setup-job
  # mounts are always the same object. Kept release-independent, matching the
  # global.serviceNames convention — one release per namespace.
  bootstrap:
    configMap:
      name: "thunder-bootstrap"
      files:
        - 01-default-resources.sh
        - 02-sample-resources.sh
